# Railway settings for this service, kept in version control.
#
# NOT READ BY RAILWAY IN THIS PROJECT (see apps/api/railway.toml and the
# "Railway service configuration" block in RELEASE.md). The dashboard is the live
# configuration; this file is the reviewable record of what it should contain.
# The service exists in Railway's staging environment (created 2026-10-30), not yet in
# production: confirm every value there.
#
# Keep the two in sync: if you change a dashboard setting, update this file in the
# same PR.

[build]
builder = "dockerfile"
dockerfilePath = "legacy/whatsapp/Dockerfile"
watchPatterns = [
  "legacy/whatsapp/**",
]

[deploy]
# `/` is the service's health check. The app binds PORT when Railway sets it.
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
