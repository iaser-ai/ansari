name: EAS Update

# Dispatches the EAS Workflow apps/frontend/.eas/workflows/update.yml. The update
# itself runs on EAS; this job only installs the workspace (the EAS CLI
# evaluates the app config on this runner) and hands the run off. Follow it
# from the EAS run URL printed in the last step; the job waits for the EAS
# run and fails if it fails. See RELEASE.md, "Native
# builds and updates".
#
# The expo-github-action `token:` input is the ONLY place EXPO_TOKEN is used.
# Never add `set -x`, env dumps or debug output to this job.
# EXPO_TOKEN is read from the GitHub Environment the job runs in, named after
# the channel (development | preview | production); production's required
# reviewer must approve the run.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to update
        type: choice
        required: true
        default: all
        options:
          - all
          - ios
          - android
      channel:
        description: Update channel
        type: choice
        required: true
        default: preview
        options:
          - development
          - preview
          - production

# Queue every dispatch, never cancel one: updates to one channel must land in
# dispatch order. Grouped by channel alone (any platform), with `queue: max` so
# GitHub keeps every pending run instead of cancelling the earlier one, and the
# job `--wait`s for the EAS run, so the next update starts only after this one
# has finished publishing.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.channel }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (with a trailing version
# comment), as in ci.yml.
jobs:
  dispatch:
    name: dispatch EAS update (${{ inputs.platform }}, ${{ inputs.channel }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    # Covers install plus a full waited-on EAS update publish.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # At the repo root: the app config resolves through the workspace link graph.
      - name: Install
        run: pnpm install --frozen-lockfile

      # The only use of EXPO_TOKEN in this repo's Actions.
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: 24.12.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS workflow
        working-directory: apps/frontend
        env:
          PLATFORM: ${{ inputs.platform }}
          CHANNEL: ${{ inputs.channel }}
        run: >-
          eas workflow:run .eas/workflows/update.yml --non-interactive --wait
          -F "platform=$PLATFORM" -F "channel=$CHANNEL"
