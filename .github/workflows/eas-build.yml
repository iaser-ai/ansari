name: EAS Build

# Dispatches the EAS Workflow apps/frontend/.eas/workflows/build.yml. The build
# itself runs on EAS; this job only installs the workspace (the EAS CLI
# evaluates the app config on this runner) and hands the run off. Follow it
# from the EAS run URL printed in the last step. See RELEASE.md, "Native
# builds and updates".
#
# The expo-github-action `token:` input is the ONLY place EXPO_TOKEN is used.
# Never add `set -x`, env dumps or debug output to this job.
# EXPO_TOKEN is read from the GitHub Environment the job runs in, mapped from
# the profile: development -> development, preview -> preview,
# production-internal and production -> production (whose required reviewer
# must approve the run).

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        required: true
        default: all
        options:
          - all
          - ios
          - android
      profile:
        description: eas.json build profile
        type: choice
        required: true
        default: development
        options:
          - development
          - preview
          - production-internal
          - production

# Queue every dispatch, never cancel one: a cancelled dispatcher can leave an
# EAS run half-started (and `production` consumes an auto-incremented build
# number). `queue: max` keeps all pending runs; GitHub's default keeps one and
# cancels the earlier pending run. This serializes the DISPATCH only: the job
# does not wait, so EAS builds for one profile/platform can still overlap.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.profile }}-${{ inputs.platform }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (with a trailing version
# comment), as in ci.yml.
jobs:
  dispatch:
    name: dispatch EAS build (${{ inputs.platform }}, ${{ inputs.profile }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.profile == 'development' && 'development' || inputs.profile == 'preview' && 'preview' || 'production' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # At the repo root: the app config resolves through the workspace link graph.
      - name: Install
        run: pnpm install --frozen-lockfile

      # The only use of EXPO_TOKEN in this repo's Actions.
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: 24.12.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS workflow
        working-directory: apps/frontend
        env:
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
        run: >-
          eas workflow:run .eas/workflows/build.yml --non-interactive
          -F "platform=$PLATFORM" -F "profile=$PROFILE"
