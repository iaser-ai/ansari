name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Cancel superseded runs for the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA (with a trailing version
# comment) so a moved tag can't silently change what runs in CI.
jobs:
  api:
    # The job ID is `api` (matching apps/api), but the EMITTED NAME is
    # deliberately still `backend (...)`. Required status checks are matched by
    # NAME, and `develop`'s branch protection requires
    # `backend (lint, typecheck, test, build)`. Renaming what this job emits
    # would mean that required check never reports again, leaving every PR
    # unmergeable until a repo admin edits the protection rule — which no PR
    # can do. A job's ID and its emitted name are independent, so the ID moves
    # with the directory rename while the name stays put.
    #
    # DO NOT "fix" this to say `api`. Renaming it silently re-arms that blocker.
    # Renaming the check is a deferred follow-up: it has to be done by a repo
    # admin, editing the protection rule and this line together.
    name: backend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version input: pnpm/action-setup reads the exact version from the
      # root package.json "packageManager" field.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # `--filter ansari-api...` (trailing dots) selects the app AND its workspace
      # dependencies. @ansari/eslint-config and @ansari/tsconfig appear in scope but
      # define no lint/typecheck scripts, so turbo runs nothing FOR them — expect
      # "3 packages in scope, 1 task".
      #
      # Their correctness is still enforced, indirectly and sufficiently: the app
      # consumes both, so a broken base.js or base.json fails THIS step. They are also
      # in turbo.json globalDependencies, so editing either busts the app's cache
      # rather than replaying a stale pass. The dependency-closure filter is what makes
      # that work — a bare `--filter ansari-api` would not pick up the change.
      - name: Lint
        run: pnpm exec turbo run lint --filter ansari-api...

      # The committed dummy env (apps/api/.env.ci) is the single no-secrets env
      # source — every value is deliberately fake. No repository secrets are
      # used anywhere in this workflow.
      - name: Load CI dummy env
        run: grep -v '^#' apps/api/.env.ci >> "$GITHUB_ENV"

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter ansari-api...

      # Runs the full suite AND emits a coverage summary. Report-only — there is
      # deliberately no coverage threshold gate yet.
      - name: Test (with coverage)
        run: pnpm exec turbo run test:coverage --filter ansari-api...

      - name: Build
        run: pnpm exec turbo run build --filter ansari-api...

  # Better Auth service (issue #59: apps/auth + packages/auth). Mirrors the `api`
  # job, scoped to the auth dependency closure — `--filter ansari-auth...`
  # (trailing dots) selects apps/auth AND its workspace deps, so @ansari/auth's
  # lint/typecheck/test run here too. This is the ONLY job that reaches apps/auth;
  # neither `ansari-api...` nor `ansari-frontend...` does. (packages/auth is ALSO
  # lint+typecheck'd by the frontend job's `--filter ./packages/*` step — but that
  # step runs no test/build, so its tests need this job as their home.)
  #
  # ⚠️ NOT YET A REQUIRED CHECK. GitHub only blocks merges on checks in develop's
  # required list, which is admin-only to edit. Until an admin adds
  # `auth (lint, typecheck, test, build)` there, this job RUNS and can FAIL while
  # PRs merge anyway — covered on paper, enforcing nothing. Making it required is
  # tracked as an admin step in #50. Do not assume a green here gates merges until
  # that is done.
  auth:
    name: auth (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec turbo run lint --filter ansari-auth...

      # Committed dummy env (apps/auth/.env.ci) — every value is deliberately
      # fake, no repository secrets. Loaded so any code path that reads env has
      # values during typecheck/test/build.
      - name: Load CI dummy env
        run: grep -v '^#' apps/auth/.env.ci >> "$GITHUB_ENV"

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter ansari-auth...

      - name: Test
        run: pnpm exec turbo run test --filter ansari-auth...

      - name: Build
        run: pnpm exec turbo run build --filter ansari-auth...

  frontend:
    # Emitted name deliberately unchanged (human decision, spec 48), even though
    # this job now also runs `build`. Check names are matched by branch
    # protection; this one is not currently required on `develop`, but it is
    # frozen alongside the api job's so that any future rename is done as ONE
    # coordinated admin change rather than piecemeal. The label lagging its
    # contents is the accepted cost.
    name: frontend (lint, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec turbo run lint --filter ansari-frontend...

      # `typecheck` no longer chains `gen:types` with `&&` — turbo.json declares
      # `typecheck.dependsOn: ["gen:types"]`, so the graph regenerates the
      # gitignored uniwind-types.d.ts before tsc runs. (build:web KEEPS its
      # in-script chain: Dockerfile.web has no turbo. See turbo.json.)
      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter ansari-frontend...

      # This step exists for @ansari/types specifically — the one package under
      # packages/ with NO consumer, so it sits outside every app's dependency closure
      # and no `--filter <app>...` can reach it. `./packages/*` now puts four packages
      # in scope (eslint-config, tsconfig, types, auth); the tasks that RUN are the
      # lint+typecheck of the two that define them — @ansari/types and @ansari/auth —
      # so expect "4 packages in scope, 4 tasks".
      #
      # @ansari/auth is picked up here incidentally (lint+typecheck only); its test AND
      # build coverage live in the dedicated `auth` job above via `ansari-auth...`. The
      # two config packages (eslint-config, tsconfig) define no tasks and need no step:
      # the apps that consume them fail if they break.
      #
      # Placed BEFORE the frontend build deliberately: steps are sequential and
      # fail-fast, so running it after `build` would mean a build failure silently
      # skips the only coverage @ansari/types gets.
      - name: Lint + typecheck shared packages
        run: pnpm exec turbo run lint typecheck --filter './packages/*'

      # NEW in spec 48: the frontend was never built in CI. `pnpm build` now
      # means "both apps", so this enforces that rather than merely claiming it.
      # expo export already runs in Dockerfile.web at deploy time, so this moves
      # an existing failure mode earlier rather than inventing a new one.
      - name: Build
        run: pnpm exec turbo run build --filter ansari-frontend...

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # scan full history

      # Plain binary instead of gitleaks-action: the action requires a license
      # key for organization repos; the binary is free for all use. The tarball
      # is verified against its published SHA-256 checksum before extraction so
      # a tampered release artifact can't run in CI.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.24.3
          EXPECTED_SHA=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${EXPECTED_SHA}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan
        run: gitleaks detect --redact -v -c .gitleaks.toml
