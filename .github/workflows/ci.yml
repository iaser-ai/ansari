name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Cancel superseded runs for the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA (with a trailing version
# comment) so a moved tag can't silently change what runs in CI.
jobs:
  backend:
    name: backend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version input: pnpm/action-setup reads the exact version from the
      # root package.json "packageManager" field.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter ansari-backend lint

      # The committed dummy env (backend/.env.ci) is the single no-secrets env
      # source — every value is deliberately fake. No repository secrets are
      # used anywhere in this workflow.
      - name: Load CI dummy env
        run: grep -v '^#' backend/.env.ci >> "$GITHUB_ENV"

      - name: Typecheck
        run: pnpm --filter ansari-backend typecheck

      # Runs the full suite AND emits a coverage summary. Report-only — there is
      # deliberately no coverage threshold gate yet.
      - name: Test (with coverage)
        run: pnpm --filter ansari-backend test:coverage

      - name: Build
        run: pnpm --filter ansari-backend build

  frontend:
    name: frontend (lint, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter ansari-frontend lint

      # typecheck first regenerates uniwind-types.d.ts (gitignored, needed by
      # tsc) via the package's gen:types script.
      - name: Typecheck
        run: pnpm --filter ansari-frontend typecheck

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # scan full history

      # Plain binary instead of gitleaks-action: the action requires a license
      # key for organization repos; the binary is free for all use. The tarball
      # is verified against its published SHA-256 checksum before extraction so
      # a tampered release artifact can't run in CI.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.24.3
          EXPECTED_SHA=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${EXPECTED_SHA}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan
        run: gitleaks detect --redact -v -c .gitleaks.toml
