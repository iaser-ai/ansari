name: MCP application
on:
  pull_request:
    paths: &mcp-paths
      - 'apps/mcp/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'LICENSE'
      - '.dockerignore'
      - '.github/workflows/mcp.yml'
      - 'packages/eslint-config/**'
  push:
    branches: [main, develop]
    paths: *mcp-paths
permissions:
  contents: read
jobs:
  mcp:
    name: MCP application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Install Chromium system dependencies
        run: pnpm dlx playwright@1.64.0 install-deps chromium
      - name: Install from the workspace lockfile
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --filter ansari-mcp...
      - name: Verify the MCP application
        run: |
          pnpm mcp exec playwright install chromium
          pnpm mcp verify
      - name: Verify the root-context container
        run: bash apps/mcp/scripts/verify-container.sh
