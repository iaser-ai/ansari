# Railway config for the backend service. The service's root directory
# must be the repo root (pnpm workspace); point the service's "config
# file path" at backend/railway.toml.

[build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile"
watchPatterns = [
  "backend/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
