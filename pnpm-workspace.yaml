packages:
  - apps/*
  - packages/*

# Refuse installs on a Node/pnpm outside the `engines` range instead of only
# warning. Set here (not in .npmrc) because .npmrc's engine-strict stops being
# enforced on pnpm >=11 — pnpm-workspace.yaml hard-fails on every pnpm version.
engineStrict: true

# Single source of truth for toolchain versions shared across packages.
# Packages reference these as "catalog:" so versions cannot drift.
catalog:
  typescript: ~6.0.3
  eslint: ^9.39.5
  typescript-eslint: ^8.67.0

# pnpm 10 blocks dependency postinstall scripts unless allowlisted here.
# These all ran their scripts under npm and need them: native addons
# (bcrypt), platform binaries (sharp, esbuild, @sentry/cli, unrs-resolver),
# and codegen (protobufjs, @google/genai).
onlyBuiltDependencies:
  - "@google/genai"
  - "@sentry/cli"
  - bcrypt
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver
