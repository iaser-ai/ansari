# Railway config for this service, kept in version control.
#
# REFERENCE ONLY unless the service is explicitly pointed at this file. Railway
# resolves a config file relative to the service's Root Directory, which is the
# REPO ROOT here (the pnpm workspace needs the root lockfile) — so this file, one
# level down, is not picked up automatically. The dashboard settings are
# authoritative; see the "Railway service configuration" block in RELEASE.md.
#
# Keep this in sync when you change the dashboard, so the intended configuration
# stays reviewable in git.

[build]
builder = "dockerfile"
dockerfilePath = "apps/frontend/Dockerfile.web"
watchPatterns = [
  "apps/frontend/**",
  # Shared workspace packages are COPYied into this image (see the Dockerfile),
  # so a packages-only change alters the built artifact. Without this pattern the
  # change ships nothing: no rebuild, no deploy, no error — the image silently
  # drifts from the repo.
  "packages/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
