# Railway config for the frontend WEB service (static SPA via Caddy).
# The service's root directory must be the repo root (pnpm workspace);
# point the service's "config file path" at apps/frontend/railway.toml.

[build]
builder = "dockerfile"
dockerfilePath = "apps/frontend/Dockerfile.web"
watchPatterns = [
  "apps/frontend/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
