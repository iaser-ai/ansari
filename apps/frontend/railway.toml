# Railway settings for this service, kept in version control.
#
# NOT READ BY RAILWAY IN THIS PROJECT (confirmed by the operator, 2026-08-21).
# Deployment is configured in the Railway dashboard using a Dockerfile path:
#   apps/frontend/Dockerfile.web
# Railway does support a config-as-code path setting, so a future maintainer could
# switch to it — this project does not. The dashboard is the live configuration;
# this file is the reviewable record of what it should contain.
#
# Keep the two in sync: if you change a dashboard setting, update this file in the
# same PR. See the "Railway service configuration" block in RELEASE.md.
#
# Service variables (dashboard; baked into the bundle at build time by
# Dockerfile.web, so a change needs a redeploy), one environment per pair.
# BOTH ARE MANDATORY on EVERY web service built from Dockerfile.web (today staging
# web only; a production apps/frontend service when one is created, #305):
# Dockerfile.web's guard (scripts/check-web-env.mjs, #317) fails the build when
# either is unset or empty, and when one names production and the other does not.
# Production web stays on legacy/frontend-web for now (#416): its own Dockerfile,
# EXPO_PUBLIC_API_V2_URL, no such guard; neither variable below is set on it.
#   EXPO_PUBLIC_API_URL   https://api.askansari.ai   (staging: https://api-staging.askansari.ai)
#   EXPO_PUBLIC_AUTH_URL  https://auth.askansari.ai  (staging: https://auth-staging.askansari.ai)

[build]
builder = "dockerfile"
dockerfilePath = "apps/frontend/Dockerfile.web"
watchPatterns = [
  "apps/frontend/**",
  # Shared workspace packages are COPYied into this image (see the Dockerfile),
  # so a packages-only change alters the built artifact. Without this pattern the
  # change ships nothing: no rebuild, no deploy, no error — the image silently
  # drifts from the repo.
  "packages/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
